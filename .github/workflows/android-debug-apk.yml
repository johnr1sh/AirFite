name: Build AirFite debug APK

on:
  push:
    paths:
      - "**/*.gradle.kts"
      - "**/gradle.properties"
      - "app/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

concurrency:
  group: airfite-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set Git default branch for runner
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.8"
      - name: Run unit tests, lint, and build APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --warning-mode=all
      - uses: actions/upload-artifact@v7
        with:
          name: AirFite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
