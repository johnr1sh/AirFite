name: Build Pocket Engineer APK

on:
  push:
    paths:
      - "PocketEngineer/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PocketEngineer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PocketEngineer-debug-apk
          path: PocketEngineer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
